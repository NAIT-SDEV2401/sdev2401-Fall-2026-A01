{% extends 'base.html' %}

{% block content %}

<h2 class="text-2xl font-semibold text-gray-800 mb-4">Register</h2>
<form method="post">
  <!-- STUDENT TODO: embed your CSRF token here. -->
  
  <!-- Observe how the form is created -->
  {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
        {{ field.label }}
      </label>
      {{ field }}
      {% if field.errors %}
        <p class="text-sm text-red-500 mt-1">
            {{ field.errors|striptags }}
        </p>
      {% endif %}
    </div>
  {% endfor %}
  <button
    class="px-4 py-2 mt-4 mb-4 bg-emerald-600 text-white font-semibold rounded-lg hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    type="submit"
  >
    Register
  </button>
</form>

{% endblock %}
